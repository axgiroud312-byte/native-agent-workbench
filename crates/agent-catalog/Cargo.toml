[package]
name = "agent-catalog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Agent registry metadata, local discovery and reviewed isolated installation"

[dependencies]
workbench-core = { path = "../workbench-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["fs", "process", "io-util", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
futures = "0.3.34"
sha2 = "0.10"
process-wrap = { version = "=10.0.1", features = ["tokio1"] }

[lints]
workspace = true
