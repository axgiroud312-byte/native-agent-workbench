[package]
name = "agent-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "ACP Codex process lifecycle and shared workbench event adapter"

[dependencies]
workbench-core = { path = "../workbench-core" }
agent-client-protocol = "=5.0.0"
tokio = { version = "1.54.1", features = ["rt", "process", "io-util", "sync", "time", "macros"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
futures = "0.3.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
process-wrap = { version = "=10.0.1", features = ["tokio1"] }
open = "5.4.5"

[lints]
workspace = true
