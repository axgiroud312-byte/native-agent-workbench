[workspace]
members = ["crates/app", "crates/workbench-core", "crates/agent-runtime", "crates/workbench-storage"]
default-members = ["crates/app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/axgiroud312-byte/native-agent-workbench"

[workspace.dependencies]
gpui-kit = "=0.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"

# Keep local development output smaller; ship release builds separately.
[profile.dev]
debug = 0
