name: Rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Build native Windows application
        run: cargo build --locked --workspace
      - name: Upload development executable
        uses: actions/upload-artifact@v4
        with:
          name: agent-workbench-windows-dev
          path: target/debug/agent-workbench.exe
          retention-days: 3
