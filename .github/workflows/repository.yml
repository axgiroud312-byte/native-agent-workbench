name: Repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository documents
        run: test -s README.md && test -s LICENSE

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Rust workspace when present
        if: ${{ hashFiles('Cargo.toml') != '' }}
        run: cargo build --locked --workspace
      - name: Report empty workspace
        if: ${{ hashFiles('Cargo.toml') == '' }}
        run: Write-Output 'No application code is present; there is nothing to build.'
