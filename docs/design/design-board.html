'src/ui/session_list.rs':'use gpui::*;\nuse gpui_component::input::InputState;\n\npub struct SessionList {\n    query: Entity<InputState>,\n    selected: Option<SessionId>,\n}\n\nimpl SessionList {\n    fn filter(&self, title: &str, cx: &App) -> bool {\n        let query = self.query.read(cx).value();\n        title.to_lowercase()\n            .contains(&query.to_lowercase())\n    }\n\n    fn select_next(&mut self, cx: &mut Context<Self>) {\n        self.move_selection(1, cx);\n    }\n}',
'src/ui/theme.rs':'pub const WINDOW: &str = "#191B1D";\npub const SIDEBAR: &str = "#1D1F21";\npub const WORKSPACE: &str = "#242629";\npub const SURFACE: &str = "#2B2D30";\n\npub const TEXT_PRIMARY: &str = "#E6E7E9";\npub const TEXT_SECONDARY: &str = "#A4A8AD";\n\npub const CONTROL_RADIUS: f32 = 6.0;\npub const COMPOSER_RADIUS: f32 = 10.0;',

'README.md':'# Agent Workbench\n\n原生桌面 Agent 工作台。\n\n## 工作区\n\n- 项目与会话\n- Agent 对话\n- 文件编辑与浏览器预览\n\n## 开发\n\n```sh\ncargo run -p app\n```'};

function ensureTab(kind,ref,projectId=currentProject){const id=kind==='file'?`file:${projectId}:${ref}`:`${kind}:${ref}`;if(!contentTabs.some(t=>t.id===id))contentTabs.push({id,kind,ref,project:projectId});return id}

function activateContent(id){capturePanel();const t=contentTabs.find(t=>t.id===id);if(!t)return;if(t.kind==='session'){closePanel();switchSession(t.ref);return}activeContent=id;if(t.kind==='file'){selectedFile=t.ref;openPanel('files',false)}else if(t.kind==='browser'){currentBrowser=t.ref;openPanel('browser',false)}else{currentTerminal=t.ref;openPanel('terminal',false)}drawContentTabs();save()}
function ensureBrowser(){let page=browserPages.find(p=>p.id===currentBrowser&&p.project===currentProject)||browserPages.find(p=>p.project===currentProject);if(!page){page={id:'web'+Date.now(),project:currentProject,history:['http://localhost:3000'],index:0,checked:false,scroll:0};browserPages.push(page)}currentBrowser=page.id;return page}

function createBrowser(){capturePanel();let p={id:'web'+Date.now(),project:currentProject,history:['about:blank'],index:0,checked:false,scroll:0};browserPages.push(p);currentBrowser=p.id;activeContent=ensureTab('browser',p.id);openPanel('browser',false);$('#browserAddress')?.focus();$('#browserAddress')?.select();save()}
function ensureTerminal(){let t=terminalPages.find(t=>t.id===currentTerminal&&t.project===currentProject)||terminalPages.find(t=>t.project===currentProject);if(!t){t={id:'term'+Date.now(),project:currentProject,title:'终端 1',draft:'',history:[],lines:[{kind:'muted',text:'PowerShell · '+project().name},{kind:'command',text:'❯ cargo check -p ui'},{kind:'success',text:'    Checking workbench-ui v0.1.0\n    Finished dev profile in 1.42s'}],scroll:0,busy:false};terminalPages.push(t)}currentTerminal=t.id;return t}

const response='已补齐会话输入与面板切换的状态处理。\n\n### 关键实现\n\n草稿按会话保存，切换时恢复输入位置。文件和网页分别保留自己的状态。\n\n```rust\nfn restore_draft(session: &Session) -> String {\n    session.draft.clone().unwrap_or_default()\n}\n```\n\n### 已检查\n\n- 切换会话后草稿仍在\n- 编辑器放大后可以还原\n- 正在运行的任务不会被面板切换中断';
function run(s,p){s.status='starting';s.activeConfig={...p.config};s.held=false;s.messages.push({kind:'user',...p});s.follow=true;if(s.title==='新会话')s.title=(p.text||'图片任务').slice(0,18);s.time='刚刚';if(s.id===current){drawChat();drawHeader();drawComposer()}drawSessions();save();let state={phase:0,pos:0,tick:0};timers.set(s.id,state);state.timer=setInterval(()=>{state.tick++;if(state.phase===0){if(state.tick<5)return;s.status='running';s.messages.push({kind:'tool',running:true});state.toolIndex=s.messages.length-1;state.phase=1;state.tick=0;if(s.id===current){drawChat();drawHeader();drawComposer()}drawSessions();return}if(state.phase===1){if(state.tick<10)return;s.messages[state.toolIndex].running=false;s.messages.push({kind:'assistant',text:'',streaming:true,agent:s.activeConfig.agent});state.index=s.messages.length-1;state.phase=2;if(s.id===current)drawChat();return}let m=s.messages[state.index];state.pos+=3;let text=response;if(s.steered){m.steered=true;text+='\n\n已收到你的补充要求，会一并保留。'}m.text=text.slice(0,state.pos);if(s.id===current&&view==='work'&&!zoomed){let node=$(`#message-${s.id}-${state.index}`);if(node){const sel=window.getSelection();if(!(sel&&!sel.isCollapsed&&node.contains(sel.anchorNode))){let el=$('#conversation'),old=el.scrollTop;node.innerHTML=markdown(m.text)+'<span class="cursor"></span>';el.scrollTop=s.follow&&settings.follow?el.scrollHeight:old;updateJump()}}}if(state.pos>=text.length){clearInterval(state.timer);timers.delete(s.id);m.streaming=false;m.result=true;s.steered=false;s.status='idle';if(s.id===current){if(view==='work'&&!zoomed)drawChat();drawHeader();drawComposer()}drawSessions();save();if(s.queue.length&&!s.held){const next=s.queue.shift();run(s,next)}}},90)}
